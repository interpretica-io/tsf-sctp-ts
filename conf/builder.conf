# The engine and the agent are built for the same platform: the agent runs
# on the engine host. tapi_sctp drives SCTP over the agent's RPC server,
# so the suite has a real agent with an RPC server, and the SCTP client
# lives in that server.
TE_PLATFORM([], [], [-D_GNU_SOURCE], [], [],
            [logger_core tools logic_expr conf_oid rpcxdr rpc_types \
             ipc bsapi loggerten rcfapi confapi comm_net_engine rcfunix \
             tapi rcfrpc tapi_env tapi_rpc tapi_tad trc log_proc asn ndn \
             ta_job tapi_job tapi_tool \
             netconf rpctransport agentlib loggerta comm_net_agent rpcs_job \
             rpcserver rcfpch tad])

# The external library under test (conf/external.yml, pinned in
# conf/builder.conf.lock). ta_sctp and rpcs_sctp bind to the agent
# (listed again in the RPC server application below), tapi_sctp to the
# engine; all on the shared host platform.
TE_EXT_REPO_USE([tsf_sctp], [], [ta_sctp rpcs_sctp tapi_sctp])

# The sctp_* RPCs. One declaration wires rpcxdr (engine) and rpcxdrta
# (agent) both. See ta_sctp/sctp_rpc.x.m4.
TE_LIB_PARMS([rpcxdr], [], [],
             [--with-rpcdefs=tarpc_job.x.m4,../ta_sctp/sctp_rpc.x.m4])

TE_TOOLS([rgt trc])

TE_TOOL_PARMS([trc], [--with-popups --with-log-urls])

TE_APP_PARMS([tester], [--with-trc])

# The traffic engine restricted to the protocols needed; without this the
# meson build pulls the full default set, which includes SNMP and is
# unsupported under meson.
TE_LIB_PARMS([tapi_tad], [], [],
             [--with-arp --with-eth --with-ipstack \
              --with-forw --with-socket])
TE_LIB_PARMS([tad], [], [],
             [--with-arp --with-eth --with-ipstack \
              --with-forw --with-socket])

# One Test Agent of the stock unix flavour.
TE_TA_TYPE([linux], [], [unix],
           [--with-rcf-rpc --without-static-libc],
           [], [], [], [comm_net_agent rcfpch ndn asn])

# The RPC server application. tapi_sctp's RPCs run here, so it links the
# agent-side ta_sctp (SCTP over the lksctp sockets API) and rpcs_sctp on
# top of the stock RPC server. The agent host needs libsctp (lksctp-tools)
# with its development headers.
TE_TA_APP([ta_rpcprovider], [], [linux],
          [ta_rpcprovider], [], [],
          [ta_sctp rpcs_sctp \
           conf_oid ta_job comm_net_agent rpcs_job rpcserver agentlib rpcxdrta \
           rpc_types rpctransport loggerta tools logger_core \
           netconf],
          [\${EXT_SOURCES}/build.sh --extra-deps='libpcre2-8 libsctp'],
          [ta_rpcs], [])

. $TE_BASE/engine/builder/te_functions
. $TE_BASE/engine/builder/te_ta_ssh_helper
